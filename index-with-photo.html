<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verifikasi Staff 77 Performance</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #0593c1 0%, #165693 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 15px 40px rgba(0,0,0,0.3);
            max-width: 450px;
            width: 100%;
            text-align: center;
        }
        
        .logo {
            font-size: 36px;
            font-weight: bold;
            color: #0593c1;
            margin-bottom: 10px;
            letter-spacing: 2px;
        }
        
        .tagline {
            color: #666;
            font-size: 12px;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        h2 {
            color: #333;
            margin-bottom: 25px;
            font-size: 22px;
        }
        
        .verified {
            background: linear-gradient(135deg, #4CAF50 0%, #45a049 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin: 25px 0;
            animation: fadeIn 0.5s ease-in;
        }
        
        .verified h3 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        
        .verified-icon {
            font-size: 50px;
            margin-bottom: 10px;
        }
        
        .invalid {
            background: linear-gradient(135deg, #f44336 0%, #da190b 100%);
            color: white;
            padding: 20px;
            border-radius: 15px;
            margin: 25px 0;
            animation: shake 0.5s ease-in;
        }
        
        .invalid h3 {
            font-size: 24px;
            margin-bottom: 8px;
        }
        
        .invalid-icon {
            font-size: 50px;
            margin-bottom: 10px;
        }
        
        .staff-photo {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #0593c1;
            margin: 20px auto;
            display: block;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }
        
        .staff-info {
            background: #f8f9fa;
            padding: 20px;
            border-radius: 15px;
            margin: 20px 0;
            text-align: left;
            border: 2px solid #e0e0e0;
        }
        
        .info-row {
            margin: 15px 0;
            padding: 12px;
            background: white;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        .label {
            font-weight: 600;
            color: #165693;
            font-size: 14px;
        }
        
        .value {
            color: #333;
            font-size: 14px;
            font-weight: 500;
        }
        
        .footer {
            margin-top: 25px;
            padding-top: 20px;
            border-top: 2px solid #e0e0e0;
            color: #666;
            font-size: 12px;
        }
        
        .timestamp {
            color: #999;
            font-size: 11px;
            margin-top: 10px;
        }
        
        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
        
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        
        .loading {
            color: #0593c1;
            font-size: 18px;
            margin: 30px 0;
        }
        
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #0593c1;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 20px auto;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="logo">77 PERFORMANCE</div>
        <div class="tagline">OEM Quality Standard</div>
        <h2>Verifikasi Staff Official</h2>
        <div id="result">
            <div class="loading">
                <div class="spinner"></div>
                Memuat data verifikasi...
            </div>
        </div>
        <div class="footer">
            <strong>77 Performance Indonesia</strong><br>
            Automotive Aftermarket Parts Specialist
            <div class="timestamp" id="timestamp"></div>
        </div>
    </div>

    <script>
        // DATABASE STAFF 77 PERFORMANCE
        // Update data staff di sini
        const staffDatabase = {
            '7P001': {
                nama: 'Andika Barimbing',
                posisi: 'Manager Sales Area',
                foto: 'https://drive.google.com/uc?export=view&id=1FoMNUWWXTep-jjVpBi5_zUhVb72eYE2C',
                status: 'Active',
                terdaftar: '31/12/2025'
            },
            '7P002': {
                nama: 'Calvin Valentino',
                posisi: 'Business Development Manager',
                foto: '', // Kosongkan kalau belum ada foto
                status: 'Active',
                terdaftar: '31/12/2025'
            },
            '7P003': {
                nama: 'Ahmad Kurniawan',
                posisi: 'Sales Area Surabaya',
                foto: '',
                status: 'Active',
                terdaftar: '2024'
            },
            '7P004': {
                nama: 'Dewi Lestari',
                posisi: 'Sales Area Semarang',
                foto: '',
                status: 'Active',
                terdaftar: '2024'
            },
            '7P005': {
                nama: 'Rudi Hermawan',
                posisi: 'Sales Area Yogyakarta',
                foto: '',
                status: 'Active',
                terdaftar: '2024'
            }
            // Tambahkan staff baru di sini dengan format yang sama
        };

        // Fungsi untuk mendapatkan timestamp
        function getTimestamp() {
            const now = new Date();
            const options = { 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric', 
                hour: '2-digit', 
                minute: '2-digit',
                timeZone: 'Asia/Jakarta'
            };
            return 'Diverifikasi: ' + now.toLocaleDateString('id-ID', options) + ' WIB';
        }

        // Fungsi verifikasi staff
        function verifyStaff() {
            // Ambil parameter ID dari URL
            const urlParams = new URLSearchParams(window.location.search);
            const staffID = urlParams.get('id');
            const resultDiv = document.getElementById('result');
            
            // Simulasi loading
            setTimeout(() => {
                if (staffID && staffDatabase[staffID]) {
                    const staff = staffDatabase[staffID];
                    
                    // Cek status aktif
                    if (staff.status === 'Active') {
                        // Tampilkan foto jika ada
                        let photoHTML = '';
                        if (staff.foto && staff.foto !== '') {
                            photoHTML = `<img src="${staff.foto}" alt="Foto ${staff.nama}" class="staff-photo" onerror="this.style.display='none'">`;
                        }
                        
                        resultDiv.innerHTML = `
                            <div class="verified">
                                <div class="verified-icon">✓</div>
                                <h3>VERIFIED</h3>
                                <p>Staff Official Terverifikasi</p>
                            </div>
                            ${photoHTML}
                            <div class="staff-info">
                                <div class="info-row">
                                    <span class="label">ID Staff:</span>
                                    <span class="value">${staffID}</span>
                                </div>
                                <div class="info-row">
                                    <span class="label">Nama:</span>
                                    <span class="value">${staff.nama}</span>
                                </div>
                                <div class="info-row">
                                    <span class="label">Posisi:</span>
                                    <span class="value">${staff.posisi}</span>
                                </div>
                                <div class="info-row">
                                    <span class="label">Status:</span>
                                    <span class="value">${staff.status}</span>
                                </div>
                                <div class="info-row">
                                    <span class="label">Terdaftar:</span>
                                    <span class="value">${staff.terdaftar}</span>
                                </div>
                            </div>
                        `;
                    } else {
                        resultDiv.innerHTML = `
                            <div class="invalid">
                                <div class="invalid-icon">✗</div>
                                <h3>TIDAK AKTIF</h3>
                                <p>Staff tidak lagi aktif</p>
                            </div>
                        `;
                    }
                } else {
                    resultDiv.innerHTML = `
                        <div class="invalid">
                            <div class="invalid-icon">✗</div>
                            <h3>INVALID</h3>
                            <p>ID Card tidak terdaftar atau tidak valid</p>
                            <p style="margin-top: 10px; font-size: 14px;">Hubungi kantor pusat untuk verifikasi</p>
                        </div>
                    `;
                }
                
                // Update timestamp
                document.getElementById('timestamp').textContent = getTimestamp();
            }, 800);
        }

        // Jalankan verifikasi saat halaman dimuat
        verifyStaff();
    </script>
</body>
</html>
